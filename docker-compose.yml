services:
  db:
    image: postgres:15-alpine
    container_name: rural-db
    environment:
      POSTGRES_USER: rural
      POSTGRES_PASSWORD: rural123
      POSTGRES_DB: rural_safety
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rural -d rural_safety"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    container_name: rural-backend
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: rural
      DB_PASSWORD: rural123
      DB_NAME: rural_safety
      JWT_SECRET: rural-housing-safety-dev-secret
      PORT: "3000"
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: rural-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
